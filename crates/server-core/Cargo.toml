[package]
name = "crewcraft-server-core"
description = "Server domain logic: users, rooms, memberships, messages, access rules"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Meeting system lines give a start as a UTC date and time (T370a; Craft time standard).
chrono.workspace = true
crewcraft-accounts.workspace = true
# Authorization records from an external authorizer (T611b).
crewcraft-authz.workspace = true
# Media credentials: the chat server signs them for the media server (T360b2).
crewcraft-media-auth = { path = "../media-auth" }
crewcraft-proto.workspace = true
crewcraft-totp.workspace = true
chacha20poly1305.workspace = true
rand_core.workspace = true
sha2.workspace = true
subtle.workspace = true
zeroize.workspace = true

[dev-dependencies]
crewcraft-client-core.workspace = true
# The real seal and SFrame, to prove call keys end to end (T360d2).
crewcraft-sframe = { path = "../sframe" }
# The media server's core and real WebRTC offers, to prove media credentials end to end (T360b2).
crewcraft-media = { path = "../../apps/crewcraft-media" }
crewcraft-media-crypto = { path = "../media-crypto" }
str0m = { version = "0.26", default-features = false }

[lints]
workspace = true
