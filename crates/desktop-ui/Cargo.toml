[package]
name = "crewcraft-desktop-ui"
description = "The CrewCraft desktop window: egui views over the ui-model, with no I/O"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The calendar under the archive's UTC times (T350d2).
chrono.workspace = true
crewcraft-client-core.workspace = true
# How an invitation link says the person signs in (T611k).
crewcraft-enroll.workspace = true
# The reaction names (T341b).
crewcraft-proto.workspace = true
# Themes and the appearance settings file (T314).
crewcraft-strict-toml.workspace = true
crewcraft-theme.workspace = true
crewcraft-ui-model.workspace = true
# default_fonts is off: it needs Ubuntu-font-1.0, which is not approved (docs/CLEAN-ROOM.md rule 3). The window
# bundles its own OFL font (assets/fonts).
egui = { version = "0.37", default-features = false }
zeroize.workspace = true
# Image previews (T333): pure-Rust decoders only, no native code.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[dev-dependencies]
egui_kittest = "0.37"

[lints]
workspace = true
