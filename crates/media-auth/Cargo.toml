[package]
name = "crewcraft-media-auth"
description = "Short-lived, single-use media credentials: the chat server admits a person to a call, the media server checks it"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Ed25519 signatures and the media key's PKCS#8 form, in pure Rust: the media server checks credentials and must
# stay free of native code (docs/NON-RUST-DEPENDENCIES.md, "Crates that stay pure Rust"), so not ring.
ed25519-dalek = { workspace = true, features = ["pkcs8", "alloc"] }
# The key seed and each credential's nonce, from the operating system.
getrandom = "0.3"
zeroize.workspace = true

[lints]
workspace = true
