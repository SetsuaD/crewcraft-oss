# Contributor names and roles.
#
# Everyone who contributes is credited by GitHub username anyway. To be credited by more, add YOUR OWN entry below
# in your own pull request. Never add or edit someone else's entry, and never guess a name from git config, commit
# authors or GitHub profiles. To remove yours, delete it in a pull request.
