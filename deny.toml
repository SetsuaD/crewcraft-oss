# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/). Run: cargo deny check
# Licenses must be compatible with CrewCraft's MIT OR Apache-2.0 (docs/CLEAN-ROOM.md rule 3).

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    # Fonts only (approved 2026-11-17). Font files keep their own license and ship with its text; see docs/CLEAN-ROOM.md rule 3.
    "OFL-1.1",
]
confidence-threshold = 0.9

[advisories]
yanked = "deny"
# Accepted "unmaintained" notices (not vulnerabilities), each with the reason and when to drop it:
ignore = [
  # zvariant, zvariant_derive and zbus_names were folded into zbus 6 as modules, so the standalone crates are
  # marked unmaintained. They reach us only through accesskit_unix (the desktop window's screen-reader support on
  # Linux, via eframe and egui-winit). Drop these lines when accesskit moves to zbus 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; via accesskit_unix (screen reader on Linux)" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; via accesskit_unix (screen reader on Linux)" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; via accesskit_unix (screen reader on Linux)" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates depend on each other by path with no version; they are never published (publish = false).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
