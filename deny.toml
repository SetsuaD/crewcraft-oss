# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/). Run: cargo deny check
# Licenses must be compatible with CrewCraft's MIT OR Apache-2.0 (docs/CLEAN-ROOM.md rule 3).

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    # Fonts only (approved 2026-11-17). Font files keep their own license and ship with its text; see docs/CLEAN-ROOM.md rule 3.
    "OFL-1.1",
]
confidence-threshold = 0.9

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own crates depend on each other by path with no version; they are never published (publish = false).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
