[package]
name = "crewcraft-server"
description = "The CrewCraft server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Stop serving cleanly on Ctrl+C and SIGTERM (`termination`).
ctrlc = { version = "3.4", features = ["termination"] }
crewcraft-accounts.workspace = true
crewcraft-admission.workspace = true
# External sign-in (T611e): the authorizer rules, the OIDC checks and the outgoing HTTPS client.
crewcraft-authz.workspace = true
crewcraft-bootstrap.workspace = true
crewcraft-enroll.workspace = true
crewcraft-https.workspace = true
crewcraft-oidc.workspace = true
crewcraft-pki.workspace = true
crewcraft-proto.workspace = true
crewcraft-server-core.workspace = true
crewcraft-tls.workspace = true
crewcraft-totp.workspace = true
rand_core.workspace = true
rustls.workspace = true
# The authorizer's and the token endpoint's JSON answers (T611e).
serde_json = "1"
sha2.workspace = true
x509-parser.workspace = true

[dev-dependencies]
crewcraft = { path = "../crewcraft" }
crewcraft-desktop-ui.workspace = true
crewcraft-ui-model.workspace = true
zeroize.workspace = true
crewcraft-client-core.workspace = true
rcgen.workspace = true
# T611e: ID tokens signed in the test (ES256) and their key set.
base64.workspace = true
ring = "0.17"

[lints]
workspace = true
