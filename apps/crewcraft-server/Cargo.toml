[package]
name = "crewcraft-server"
description = "The CrewCraft server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Stop serving cleanly on Ctrl+C and SIGTERM (`termination`).
ctrlc = { version = "3.4", features = ["termination"] }
# The Teams exporter (T351): the `/shares` id of a shared file is its address in unpadded base64url.
base64.workspace = true
# The calendar under the Teams reader's times (T350c).
chrono.workspace = true
crewcraft-accounts.workspace = true
crewcraft-admission.workspace = true
# External sign-in (T611e): the authorizer rules, the OIDC checks and the outgoing HTTPS client.
crewcraft-authz.workspace = true
crewcraft-bootstrap.workspace = true
crewcraft-enroll.workspace = true
crewcraft-https.workspace = true
# media.toml (T360b3): the media key the chat server signs credentials with.
crewcraft-media-auth = { path = "../../crates/media-auth" }
crewcraft-oidc.workspace = true
crewcraft-pki.workspace = true
crewcraft-proto.workspace = true
crewcraft-server-core.workspace = true
# identity.toml (T611f).
crewcraft-strict-toml.workspace = true
crewcraft-tls.workspace = true
crewcraft-totp.workspace = true
# The lab guest listener parses bounded HTTP request headers.
httparse = "=1.10.1"
rand_core.workspace = true
rustls.workspace = true
# Strict JSON requests for the lab guest listener.
serde = { version = "1", features = ["derive"] }
# The authorizer's and the token endpoint's JSON answers (T611e).
serde_json = "1"
sha2.workspace = true
x509-parser.workspace = true
# The Teams exporter's (T351) sign-in token and device code are cleared from memory when dropped.
zeroize.workspace = true

[dev-dependencies]
crewcraft = { path = "../crewcraft" }
crewcraft-desktop-ui.workspace = true
crewcraft-ui-model.workspace = true
crewcraft-client-core.workspace = true
rcgen.workspace = true
# T360b4: the media core and real WebRTC offers, to show a revoked person is dropped from the media.
crewcraft-media = { path = "../crewcraft-media" }
crewcraft-media-crypto = { path = "../../crates/media-crypto" }
str0m = { version = "0.26", default-features = false }
# T611e: ID tokens signed in the test (ES256) and their key set.
ring = "0.17"

[lints]
workspace = true
