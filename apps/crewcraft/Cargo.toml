[package]
name = "crewcraft"
description = "The CrewCraft desktop client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The phone self-test (src/selftest.rs, tasks T403 and T422) for the emulator and the simulator. Never in a release:
# the platform shells' --self-test builds turn it on.
selftest = ["dep:crewcraft-totp"]

[dependencies]
# Sealing the saved device record (T313): XChaCha20-Poly1305 under a random key from the OS key store.
chacha20poly1305.workspace = true
crewcraft-client-core.workspace = true
crewcraft-desktop-ui.workspace = true
crewcraft-enroll.workspace = true
crewcraft-proto.workspace = true
crewcraft-tls.workspace = true
# Only for the self-test (feature `selftest`): it answers the authenticator step itself.
crewcraft-totp = { workspace = true, optional = true }
crewcraft-ui-model.workspace = true
# The OS key store behind one small API; each platform's store is its own crate below, so no other backend is built.
keyring-core = "1.0.1"
png = "0.18"
rand_core.workspace = true
rcgen.workspace = true
rpassword = "7.5.4"
rustls.workspace = true
sha2.workspace = true
time.workspace = true
x509-parser = { workspace = true, features = ["verify"] }
zeroize.workspace = true

# The window. default_fonts stays off (docs/CLEAN-ROOM.md rule 3): crewcraft-desktop-ui installs the bundled Inter.
# Desktop: wgpu first, glow (OpenGL) as the fallback, and the screen reader.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "glow", "wgpu", "wayland", "x11"] }

# On Android (apps/crewcraft-android, T401): OpenGL ES through glow, under Android's NativeActivity. eframe's
# screen-reader support needs GameActivity (Java) on Android, so it is left out there for now.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "android-native-activity"] }

# iOS (src/ios.rs, task T421): wgpu on Metal only (glutin has no iOS backend); the window's safe area and the
# on-screen keyboard's frame are read from UIKit through its Rust bindings (the crates winit and egui-winit already
# use on iOS; they declare Apple's own functions, nothing is compiled from C).
[target.'cfg(target_os = "ios")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu"] }
# The window's warnings and errors (eframe, winit, wgpu) on standard error, which is the app's log on iOS.
log = { version = "0.4", features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSEnumerator", "NSSet", "NSThread"] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "UIApplication",
    "UIGeometry",
    "UIKeyboardLayoutGuide",
    "UILayoutGuide",
    "UIResponder",
    "UIScene",
    "UISceneDefinitions",
    "UITrackingLayoutGuide",
    "UIView",
    "UIViewController",
    "UIWindow",
    "UIWindowScene",
] }
# The device key in the Secure Enclave, kept in the app's Keychain (T422; src/ios_keys.rs): the safe wrapper over
# Apple's Security framework that the macOS key store already uses.
security-framework = { version = "3.7", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30.1", default-features = false, features = ["signal", "term"] }

# The key store per platform (src/key_vault.rs): Credential Manager, the login Keychain, the Secret Service over zbus
# (pure Rust, with RustCrypto for the session encryption; not the libdbus backend, which links C).
[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
crewcraft-admission.workspace = true
crewcraft-pki.workspace = true
crewcraft-server-core.workspace = true
crewcraft-totp.workspace = true
# The window, driven headless for the T405 test (as crewcraft-desktop-ui's own tests do).
egui_kittest = "0.37"

[build-dependencies]
# Embeds the icon and version resource in crewcraft.exe on Windows (build.rs); uses the target's resource compiler.
embed-resource = "3"

[lints]
workspace = true
