[package]
name = "crewcraft"
description = "The CrewCraft desktop client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
crewcraft-client-core.workspace = true
crewcraft-desktop-ui.workspace = true
# The window: wgpu first, glow (OpenGL) as the fallback. default_fonts stays off (docs/CLEAN-ROOM.md rule 3): crewcraft-desktop-ui installs the bundled Inter.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "glow", "wgpu", "wayland", "x11"] }
crewcraft-enroll.workspace = true
crewcraft-proto.workspace = true
crewcraft-tls.workspace = true
crewcraft-ui-model.workspace = true
png = "0.18"
rcgen.workspace = true
rpassword = "7.5.4"
rustls.workspace = true
sha2.workspace = true
time.workspace = true
x509-parser = { workspace = true, features = ["verify"] }
zeroize.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30.1", default-features = false, features = ["signal", "term"] }

[dev-dependencies]
crewcraft-admission.workspace = true
crewcraft-pki.workspace = true
crewcraft-server-core.workspace = true
crewcraft-totp.workspace = true

[lints]
workspace = true
