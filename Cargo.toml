[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0-beta.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
publish = false

[workspace.dependencies]
# internal
crewcraft-proto = { path = "crates/proto" }
crewcraft-totp = { path = "crates/totp" }
crewcraft-enroll = { path = "crates/enroll" }
crewcraft-accounts = { path = "crates/accounts" }
crewcraft-bootstrap = { path = "crates/bootstrap" }
crewcraft-server-core = { path = "crates/server-core" }
crewcraft-client-core = { path = "crates/client-core" }
crewcraft-strict-toml = { path = "crates/strict-toml" }
crewcraft-theme = { path = "crates/theme" }
crewcraft-authz = { path = "crates/authz" }
crewcraft-oidc = { path = "crates/oidc" }
crewcraft-https = { path = "crates/https" }
crewcraft-update = { path = "crates/update" }
crewcraft-tls = { path = "crates/tls" }
crewcraft-pki = { path = "crates/pki" }
crewcraft-admission = { path = "crates/admission" }
crewcraft-ui-model = { path = "crates/ui-model" }
crewcraft-desktop-ui = { path = "crates/desktop-ui" }

# crypto: audited RustCrypto crates only, never hand-rolled primitives (docs/SECURITY-DESIGN.md)
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
subtle = "2"
argon2 = { version = "0.5", features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
zeroize = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }

# Calendar dates (the Craft time standard: no hand-rolled calendar math). Default features off: no clock, no time
# zone database, no OS calls; only the date types and their arithmetic.
chrono = { version = "0.4", default-features = false }

# TLS (docs/NON-RUST-DEPENDENCIES.md): rustls with the ring provider, TLS 1.3 only; rcgen makes test certificates.
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "x509-parser"] }
rustls-pki-types = "1"
time = { version = "0.3", default-features = false }
x509-parser = { version = "0.18", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# The Craft "never crash" set.
todo = "warn"
unimplemented = "warn"
unreachable = "warn"

# Debug and test builds keep line tables (backtraces still name files and lines) but no full debug info, and
# dependencies carry none. Full debug info made a workspace test build over 20 GB, more than a bounded CI workspace
# holds (the linker died with SIGBUS when the disk filled).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
