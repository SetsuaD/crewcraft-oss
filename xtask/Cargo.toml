[package]
name = "xtask"
description = "CrewCraft build tasks: `cargo xtask dist` builds the release packages, `cargo xtask apk` the Android app (docs/RELEASE.md)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Every dependency is used only to write (and, in the tests, read back) the package formats. All are pure Rust except
# ring, the crypto provider rustls already brings in (docs/NON-RUST-DEPENDENCIES.md).
[dependencies]
# The cabinet embedded in the MSI (MSZIP compression).
cab = "0.6"
# Release manifests (T501): the format, its parser and the Ed25519 check that servers and clients use.
crewcraft-update.workspace = true
# Signing release manifests (T501), the same Ed25519 implementation the update check uses.
ed25519-dalek.workspace = true
# gzip for the .tar.gz files and deflate for the .zip files, with the pure-Rust backend.
flate2 = "1"
# md5sums in the .deb control archive, which `dpkg --verify` checks (RustCrypto).
md-5 = "0.10"
# The Windows Installer database.
msi = "0.11"
# Reads the built executables: the ELF libraries a Linux binary links (for the .deb Depends) and the DLLs a
# Windows binary imports, and checks each macOS build is the expected architecture.
object = { version = "0.37", default-features = false, features = ["read_core", "elf", "macho", "pe", "std"] }
# The Android APK's test signing key (T400): its self-signed certificate.
rcgen.workspace = true
# Renders the app icon's PNG sizes from assets/icon/crewcraft.svg at build time.
resvg = { version = "0.50", default-features = false }
# A new release key's random seed (T501).
rand_core.workspace = true
# The Android APK's v2 signature (T400): ECDSA P-256 signing and verifying. Already in the tree under rustls.
ring = "0.17"
sha2.workspace = true
# The cabinet's file times.
time.workspace = true
# Name-based (v5) GUIDs: the MSI ProductCode, PackageCode and component GUIDs.
uuid = { version = "1", default-features = false, features = ["v5"] }
# Reads the public key in an APK signing certificate (T400).
x509-parser.workspace = true
# A release key's seed is wiped from memory after use (T501).
zeroize.workspace = true

[lints]
workspace = true
